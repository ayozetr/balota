[workspace]
members = ["workshop-helper"]
# Without this, a bare `cargo clippy`/`cargo test` in here only ever covered the
# root package — so the one component that links against Valve's SDK was never
# built by CI at all.
default-members = [".", "workshop-helper"]

[package]
name = "balota"
version = "1.0.0"
description = "Balota - DayZ server browser and mod manager for Linux"
authors = ["Ayoze Torres"]
license = "GPL-3.0-or-later WITH Steamworks-exception"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "rustls-tls",
] }
base64 = "0.22"
walkdir = "2"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
